<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>psychadelic · fractal dreams</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="art" style="touch-action: none"></canvas>

  <div id="ui">
    <div class="brand">psychadelic <span>— fractal dreams</span>
      <a class="nav" href="index.html">← flames</a><a class="nav" href="lightshow.html">← light show</a></div>
    <div class="controls">
      <button id="btn-new" title="New vibe (N)">New vibe ✦</button>
      <button id="btn-family" title="Choose the fractal (P)">Fractal: Auto</button>
      <button id="btn-cursor" title="Morph the fractal with your cursor (C)">Morph: Off</button>
      <button id="btn-dream" title="Pause / flow (Space)">Pause ❚❚</button>
      <button id="btn-save" title="Save PNG (S)">Save</button>
      <button id="btn-full" title="Fullscreen (F)">⛶</button>
      <div class="ctl" data-key="speed" data-name="Speed" title="How fast it dives, morphs and cycles colour"><label for="sl-speed">Speed</label> <input id="sl-speed" type="range" min="0" max="1" step="0.005"></div>
      <div class="ctl" data-key="glow" data-name="Glow" title="How much light blooms off bright edges"><label for="sl-glow">Glow</label> <input id="sl-glow" type="range" min="0" max="1" step="0.01"></div>
      <label>Change every <input id="sl-hold" type="range" min="6" max="124" step="1"> <span id="hold-val" class="val"></span></label>
    </div>
    <div class="hint">Drag to pan · scroll to zoom · C morph with cursor · ∿ wobble a slider (W all) · P fractal · N new vibe · Space pause · S save · H hide</div>
  </div>

  <div id="status"></div>
  <div id="flash"></div>

  <script src="js/wobble.js"></script>
  <script src="js/fractals.js"></script>
</body>
</html>
