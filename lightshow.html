<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>psychadelic · light show</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="art" style="touch-action: none"></canvas>

  <div id="ui">
    <div class="brand">psychadelic <span>— liquid light show</span> <a class="nav" href="index.html">← flames</a><a class="nav" href="fractals.html">fractal dreams →</a></div>
    <div class="controls">
      <button id="btn-new" title="New vibe (N)">New vibe ✦</button>
      <button id="btn-pattern" title="Change flow pattern (P)">Pattern: Auto</button>
      <button id="btn-cursor" title="Cursor effects on/off (C)">Cursor: Off</button>
      <button id="btn-dream" title="Pause / flow (Space)">Pause ❚❚</button>
      <button id="btn-save" title="Save PNG (S)">Save</button>
      <button id="btn-full" title="Fullscreen (F)">⛶</button>
      <div class="ctl" data-key="flow" data-name="Flow"><label for="sl-flow">Flow</label> <input id="sl-flow" type="range" min="0" max="1" step="0.005"></div>
      <div class="ctl" data-key="melt" data-name="Melt"><label for="sl-melt">Melt</label> <input id="sl-melt" type="range" min="0.5" max="0.98" step="0.01"></div>
      <div class="ctl" data-key="geo" data-name="Geometry" title="Loose and liquid ↔ sharp, intricate geometry (strongest in the centre)"><label for="sl-geo">Geometry</label> <input id="sl-geo" type="range" min="0" max="1" step="0.01"></div>
      <label>Change every <input id="sl-hold" type="range" min="4" max="124" step="1"> <span id="hold-val" class="val"></span></label>
    </div>
    <div class="hint">Move to stir · click to splash · hold to pour · C cursor on/off · ∿ wobble a slider (W all) · P pattern · N new vibe · Space pause · S save · H hide</div>
  </div>

  <div id="status"></div>
  <div id="flash"></div>

  <script src="js/wobble.js"></script>
  <script src="js/lightshow.js"></script>
</body>
</html>
