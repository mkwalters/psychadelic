<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>psychadelic · light show</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="art"></canvas>

  <div id="ui">
    <div class="brand">psychadelic <span>— liquid light show</span> <a class="nav" href="index.html">← flames</a></div>
    <div class="controls">
      <button id="btn-new" title="New vibe (N)">New vibe ✦</button>
      <button id="btn-dream" title="Pause / flow (Space)">Pause ❚❚</button>
      <button id="btn-save" title="Save PNG (S)">Save</button>
      <button id="btn-full" title="Fullscreen (F)">⛶</button>
      <label>Flow <input id="sl-flow" type="range" min="0.1" max="3" step="0.05"></label>
      <label>Melt <input id="sl-melt" type="range" min="0.5" max="0.98" step="0.01"></label>
      <label>Color drift <input id="sl-drift" type="range" min="0" max="0.06" step="0.002"></label>
    </div>
    <div class="hint">Move the mouse to stir the oil · Space pause · N new vibe · S save · H hide</div>
  </div>

  <div id="status"></div>

  <script src="js/lightshow.js"></script>
</body>
</html>
